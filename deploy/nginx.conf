# 你真的需要买这个吗 —— Nginx 站点配置（HTTPS 域名版）
# 用法：
#   1) cp deploy/nginx.conf /etc/nginx/sites-available/purchase-approval
#   2) ln -sf /etc/nginx/sites-available/purchase-approval /etc/nginx/sites-enabled/purchase-approval
#   3) nginx -t && systemctl reload nginx
# 说明：证书由 certbot 签发（certbot certonly --nginx -d furry233.cn），已配置自动续期。

# 1) IP 直连：保留 HTTP 访问（服务端 COOKIE_SECURE 已随域名切换为 true，IP 访问将无法登录，仅用于健康检查）
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2) 域名 HTTP：跳转 HTTPS
server {
    listen 80;
    server_name furry233.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3) 域名 HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name furry233.cn;

    ssl_certificate /etc/letsencrypt/live/furry233.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/furry233.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
